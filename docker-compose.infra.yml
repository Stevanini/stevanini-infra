services:
  postgres:
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    pids_limit: 256
    oom_score_adj: 300
    image: postgres:18-alpine
    container_name: infra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?defina POSTGRES_ADMIN_PASSWORD no .env}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
    networks:
      - shared_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-postgres} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 128
    oom_score_adj: 300
    image: valkey/valkey:8-alpine
    container_name: infra_valkey
    restart: unless-stopped
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - ./data/valkey:/data
    networks:
      - shared_net
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs:
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    pids_limit: 256
    oom_score_adj: 300
    image: chrislusf/seaweedfs:latest
    container_name: infra_seaweedfs
    restart: unless-stopped
    environment:
      # Identidade admin do S3: sem access key/secret válidos, o SeaweedFS recusa as requisições.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?defina S3_ACCESS_KEY no .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?defina S3_SECRET_KEY no .env}
    command: server -dir=/data -s3 -ip.bind=0.0.0.0
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - ./data/seaweedfs:/data
    networks:
      - shared_net

  keycloak:
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 2
    pids_limit: 512
    oom_score_adj: 300
    image: quay.io/keycloak/keycloak:26.0
    container_name: infra_keycloak
    restart: unless-stopped
    command: start
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://infra_postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?defina KEYCLOAK_ADMIN_PASSWORD no .env}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
      KC_SPI_THEME_STATIC_MAX_AGE: "-1"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./custom/keycloak/themes/stevanini:/opt/keycloak/themes/stevanini:ro
      - ./custom/keycloak/themes/marketplace:/opt/keycloak/themes/marketplace:ro
      # Login com Apple: 1.14.0 é a versão para Keycloak 25.0 a 26.2 (ver README da extensão ao subir o Keycloak)
      - ./custom/keycloak/providers/apple-identity-provider-1.14.0.jar:/opt/keycloak/providers/apple-identity-provider-1.14.0.jar:ro
    networks:
      - shared_net

  kong:
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1
    pids_limit: 256
    oom_score_adj: 300
    image: kong:3.8
    container_name: infra_kong
    restart: unless-stopped
    environment:
      # DB-less: rotas vêm de custom/kong/kong.yml (recarregue com `docker exec infra_kong kong reload`).
      KONG_DATABASE: "off"
      KONG_NGINX_WORKER_PROCESSES: "2"  # padrao=auto=28 workers=~1,8GB de RAM
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      # Confia no X-Forwarded-* vindo do cloudflared (rede Docker) para o Keycloak ver https.
      KONG_TRUSTED_IPS: 172.16.0.0/12
      KONG_REAL_IP_HEADER: X-Forwarded-For
      KONG_REAL_IP_RECURSIVE: "on"
      KONG_PORT_MAPS: "${KONG_PROXY_PORT:-8000}:8000"  # X-Forwarded-Port com a porta publicada
    ports:
      - "${KONG_PROXY_PORT:-8000}:8000"
      # Admin API sem autenticação: só em localhost.
      - "127.0.0.1:${KONG_ADMIN_PORT:-8001}:8001"
    volumes:
      - ./custom/kong/kong.yml:/kong/kong.yml:ro
    # sockets em tmpfs: um desligamento brusco deixava o socket velho e o Kong entrava em loop (bind 98)
    tmpfs:
      - /usr/local/kong/sockets:mode=1777
    networks:
      - shared_net
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Telemetria de erros (protocolo Sentry). Modo all-in-one: web + worker num só container; banco no postgres compartilhado e fila/cache no Valkey (db 1).
  # Antes do primeiro start crie o banco (README, seção GlitchTip). Migrations rodam sozinhas na partida.
  glitchtip:
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    pids_limit: 256
    oom_score_adj: 300
    image: glitchtip/glitchtip:${GLITCHTIP_VERSION:-latest}
    container_name: infra_glitchtip
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${GLITCHTIP_DB_USER:-glitchtip}:${GLITCHTIP_DB_PASSWORD:?defina GLITCHTIP_DB_PASSWORD no .env}@infra_postgres:5432/${GLITCHTIP_DB_NAME:-glitchtip}
      VALKEY_URL: redis://infra_valkey:6379/1
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?defina GLITCHTIP_SECRET_KEY no .env (openssl rand -hex 32)}
      PORT: "8000"
      # URL pública, com esquema: vira o host dos DSNs e dos links.
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8010}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-glitchtip@localhost}
      # shortcut: e-mail só no log do container; trocar por smtp://… para receber alertas.
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      # Só o primeiro usuário se cadastra; os demais são criados no admin.
      ENABLE_USER_REGISTRATION: "false"
      CELERY_WORKER_AUTOSCALE: "1,3"
      CELERY_WORKER_MAX_TASKS_PER_CHILD: "10000"
    ports:
      - "${GLITCHTIP_PORT:-8010}:8000"
    volumes:
      - ./data/glitchtip:/code/uploads
    networks:
      - shared_net

  zitadel-api:
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1
    pids_limit: 256
    oom_score_adj: 300
    image: ghcr.io/zitadel/zitadel:${ZITADEL_VERSION:-v4.16.0}
    container_name: infra_zitadel_api
    restart: unless-stopped
    user: "0"
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY:?defina ZITADEL_MASTERKEY (32 chars) no .env}"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_DOMAIN:-localhost}
      ZITADEL_EXTERNALPORT: ${ZITADEL_EXTERNALPORT:-8000}
      ZITADEL_EXTERNALSECURE: ${ZITADEL_EXTERNALSECURE:-false}
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://${ZITADEL_DB_USER:-zitadel}:${ZITADEL_DB_PASSWORD:?defina ZITADEL_DB_PASSWORD no .env}@infra_postgres:5432/${ZITADEL_DB_NAME:-zitadel}?sslmode=disable
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Automatically Initialized IAM_LOGIN_CLIENT
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: ${ZITADEL_PUBLIC_SCHEME:-http}://${ZITADEL_DOMAIN:-localhost}:${ZITADEL_EXTERNALPORT:-8000}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: ${ZITADEL_PUBLIC_SCHEME:-http}://${ZITADEL_DOMAIN:-localhost}:${ZITADEL_EXTERNALPORT:-8000}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: ${ZITADEL_PUBLIC_SCHEME:-http}://${ZITADEL_DOMAIN:-localhost}:${ZITADEL_EXTERNALPORT:-8000}/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: ${ZITADEL_PUBLIC_SCHEME:-http}://${ZITADEL_DOMAIN:-localhost}:${ZITADEL_EXTERNALPORT:-8000}/ui/v2/login/login?samlRequest=
      # Cache no Valkey (compatível com o protocolo Redis; modo standalone).
      ZITADEL_CACHES_CONNECTORS_REDIS_ENABLED: "true"
      ZITADEL_CACHES_CONNECTORS_REDIS_URL: redis://infra_valkey:6379/0
      ZITADEL_CACHES_INSTANCE_CONNECTOR: redis
      ZITADEL_CACHES_MILESTONES_CONNECTOR: redis
      ZITADEL_CACHES_ORGANIZATION_CONNECTOR: redis
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:rw
    networks:
      - shared_net
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s

  zitadel-login:
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.5
    pids_limit: 128
    oom_score_adj: 300
    image: ghcr.io/zitadel/zitadel-login:${ZITADEL_VERSION:-v4.16.0}
    container_name: infra_zitadel_login
    restart: unless-stopped
    user: "0"
    depends_on:
      zitadel-api:
        condition: service_healthy
    environment:
      ZITADEL_API_URL: http://zitadel-api:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      ZITADEL_SESSION_COOKIE_SECRET: ${LOGIN_SESSION_COOKIE_SECRET:?defina LOGIN_SESSION_COOKIE_SECRET (32+ chars) no .env}
      CUSTOM_REQUEST_HEADERS: Host:${ZITADEL_DOMAIN:-localhost},X-Forwarded-Proto:${ZITADEL_PUBLIC_SCHEME:-http}
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:ro
    networks:
      - shared_net

volumes:
  zitadel-bootstrap:

networks:
  shared_net:
    external: true
    name: shared_net