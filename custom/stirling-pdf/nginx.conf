server {
  listen 80;
  client_max_body_size 0;
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;
  location = /stevanini-doc.css { alias /stevanini/stevanini-doc.css; add_header Cache-Control "no-cache"; }
  location = /stevanini-GoogleSans.ttf { alias /stevanini/GoogleSans.ttf; add_header Cache-Control "public, max-age=86400"; }
  location = /stevanini-favicon.svg { alias /stevanini/stevanini-favicon.svg; add_header Cache-Control "no-cache"; }
  location = /stevanini-wm-black.svg { alias /stevanini/wm-black.svg; add_header Cache-Control "no-cache"; }
  location = /stevanini-wm-white.svg { alias /stevanini/wm-white.svg; add_header Cache-Control "no-cache"; }
  location = /stevanini-wm-grey.svg { alias /stevanini/wm-grey.svg; add_header Cache-Control "no-cache"; }
  location = /modern-logo/StirlingPDFLogoBlackText.svg { alias /stevanini/wm-black.svg; add_header Cache-Control "no-cache"; }
  location = /modern-logo/StirlingPDFLogoWhiteText.svg { alias /stevanini/wm-white.svg; add_header Cache-Control "no-cache"; }
  location = /modern-logo/StirlingPDFLogoGreyText.svg { alias /stevanini/wm-grey.svg; add_header Cache-Control "no-cache"; }
  location = /modern-logo/StirlingPDFLogoNoTextDark.svg { alias /stevanini/icon.svg; add_header Cache-Control "no-cache"; }
  location = /modern-logo/StirlingPDFLogoNoTextLight.svg { alias /stevanini/icon.svg; add_header Cache-Control "no-cache"; }
  location = /modern-logo/logo-tooltip.svg { alias /stevanini/icon.svg; add_header Cache-Control "no-cache"; }
  location = /modern-logo/logo192.png { alias /stevanini/png/logo192.png; add_header Cache-Control "no-cache"; }
  location = /modern-logo/logo512.png { alias /stevanini/png/logo512.png; add_header Cache-Control "no-cache"; }
  location = /modern-logo/favicon.ico { alias /stevanini/icon.svg; types {} default_type image/svg+xml; add_header Cache-Control "no-cache"; }
  location = /modern-logo/favicon.png { alias /stevanini/png/favicon.png; add_header Cache-Control "no-cache"; }
  location ~ ^/assets/wordmark-light-.*\.svg$ { alias /stevanini/wm-black.svg; add_header Cache-Control "no-cache"; }
  location ~ ^/assets/wordmark-dark-.*\.svg$ { alias /stevanini/wm-white.svg; add_header Cache-Control "no-cache"; }
  location = /favicon.ico { alias /stevanini/icon.svg; types {} default_type image/svg+xml; add_header Cache-Control "no-cache"; }
  location = /manifest.json { alias /stevanini/manifest.json; add_header Cache-Control "no-cache"; }
  location / {
    proxy_pass http://stirling-pdf:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Accept-Encoding "";
    proxy_http_version 1.1;
    sub_filter_once on;
    sub_filter '<link rel="icon" href="modern-logo/favicon.ico" />' '<link rel="icon" type="image/svg+xml" href="/stevanini-favicon.svg?v=9" />';
    sub_filter 'Sign In - Stirling PDF</title>' 'Stevanini Document Editor</title>';
    sub_filter '</head>' '<link rel="stylesheet" href="/stevanini-doc.css?v=35"><script>(function(){var t=document.querySelector("title");if(!t)return;var busy=0;function ft(){var v=document.title.replace(/Stirling([ -]?PDF)?/g,"Stevanini Document Editor").replace(/^(Entrar|Iniciar sessão|Login|Sign In) - /,"");if(v!=document.title)document.title=v}function fi(){if(busy)return;busy=1;var L=document.querySelectorAll("link[rel~=icon]"),ok=0;L.forEach(function(l){if(l.getAttribute("href")!="/stevanini-favicon.svg?v=9"){l.setAttribute("href","/stevanini-favicon.svg?v=9");l.setAttribute("type","image/svg+xml")}ok=1});if(!ok){var n=document.createElement("link");n.rel="icon";n.type="image/svg+xml";n.href="/stevanini-favicon.svg?v=9";document.head.appendChild(n)}busy=0}ft();fi();new MutationObserver(ft).observe(t,{childList:true,characterData:true,subtree:true});new MutationObserver(fi).observe(document.head,{childList:true,subtree:true,attributes:true,attributeFilter:["href"]})})();</script><script>(function(){var R=/Stirling([ -]?PDF)?/g,T=/Stirling/,N="Stevanini Document Editor",q=0;function fx(s){return s.replace(R,N)}function walk(n){if(n.nodeType==3){if(T.test(n.nodeValue))n.nodeValue=fx(n.nodeValue)}else if(n.nodeType==1){if(n.tagName=="SCRIPT"||n.tagName=="STYLE")return;["placeholder","aria-label","title","alt"].forEach(function(a){var v=n.getAttribute(a);if(v&&T.test(v))n.setAttribute(a,fx(v))});for(var c=n.firstChild;c;c=c.nextSibling)walk(c)}}function run(){q=0;if(document.body)walk(document.body);if(T.test(document.title))document.title=fx(document.title)}function sch(){if(!q)q=requestAnimationFrame(run)}document.addEventListener("DOMContentLoaded",function(){run();new MutationObserver(sch).observe(document.documentElement,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:["placeholder","aria-label","title","alt"]})})})();</script><script>(function(){var u=0,n=0;["pointerdown","keydown"].forEach(function(e){addEventListener(e,function(){u=1},true)});var i=setInterval(function(){var a=document.activeElement;if(u||++n>30)return clearInterval(i);if(a&&a.tagName=="INPUT"){a.blur();clearInterval(i)}},100)})();</script></head>';
  }
}
