server {
  listen 80;
  client_max_body_size 0;
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;
  location = /stevanini-paperless.css { alias /stevanini/stevanini-paperless.css; add_header Cache-Control "no-cache"; }
  location = /stevanini-favicon.svg { alias /stevanini/stevanini-favicon.svg; add_header Cache-Control "no-cache"; }
  location = /stevanini-eye.js { alias /stevanini/stevanini-eye.js; add_header Cache-Control "no-cache"; }
  location ~ /apple-touch-icon\.png$ { alias /stevanini/png/apple-touch-icon.png; add_header Cache-Control "no-cache"; }
  location ~ /icon-192\.png$ { alias /stevanini/png/icon-192.png; add_header Cache-Control "no-cache"; }
  location ~ /icon-512\.png$ { alias /stevanini/png/icon-512.png; add_header Cache-Control "no-cache"; }
  location ~ /icon-512-maskable\.png$ { alias /stevanini/png/icon-512-maskable.png; add_header Cache-Control "no-cache"; }
  location ~ /manifest\.webmanifest$ { alias /stevanini/manifest.webmanifest; add_header Cache-Control "no-cache"; }
  location / {
    proxy_pass http://paperless:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Accept-Encoding "";
    proxy_http_version 1.1;
    sub_filter_once on;
    sub_filter 'Paperless-ngx sign in' 'Stevanini Documents';
    sub_filter 'Entrar no Paperless-ngx' 'Stevanini Documents';
    sub_filter '</head>' '<link rel="stylesheet" href="/stevanini-paperless.css?v=15"><link rel="icon" type="image/svg+xml" href="/stevanini-favicon.svg?v=1"><script src="/stevanini-eye.js?v=2"></script><script>(function(){function f(){var v=document.title.replace(/Paperless-ngx|Paperless/g,"Stevanini Documents");if(v!=document.title)document.title=v}f();var t=document.querySelector("title");if(t)new MutationObserver(f).observe(t,{childList:true,characterData:true,subtree:true})})();</script></head>';
  }
}
