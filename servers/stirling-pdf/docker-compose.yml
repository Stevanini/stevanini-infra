services:
  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    container_name: stirling-pdf
    restart: unless-stopped
    expose: ["8080"]
    environment:
      DOCKER_ENABLE_SECURITY: "false"
      LANGS: pt_BR
      UI_APPNAME: "Stevanini Document Editor"
      UI_APPNAMENAVBAR: "Stevanini Document Editor"
    volumes:
      - /mnt/raid/stirling-pdf:/usr/share/tessdata

  # Proxy que injeta a marca Stevanini (CSS, favicon, título) sem mexer na imagem do Stirling.
  stirling-brand:
    image: nginx:alpine
    container_name: stirling-brand
    restart: unless-stopped
    depends_on: [stirling-pdf]
    ports: ["8080:80"]
    volumes:
      - ./stevanini/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./stevanini:/stevanini:ro
